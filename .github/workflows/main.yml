name: Build Expo Release APK (Auto Signed)

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Expo Prebuild
        run: npx expo prebuild

      # الخطوة دي السحر كله: بنعمل مفتاح وهمي في وقت التشغيل
      - name: Generate Temporary Keystore
        run: |
          keytool -genkey -v -keystore android/app/temp.keystore \
          -alias mykeyalias \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass password123 -keypass password123 \
          -dname "CN=Temp, OU=Temp, O=Temp, L=Temp, S=Temp, C=TE"

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/temp.keystore \
            -Pandroid.injected.signing.store.password=password123 \
            -Pandroid.injected.signing.key.alias=mykeyalias \
            -Pandroid.injected.signing.key.password=password123

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
