name: Build Expo APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Expo Prebuild
        # بيحول مشروع الإكسبو لملفات أندرويد حقيقية عشان نقدر نبنيها
        run: npx expo prebuild

      - name: Build APK (Debug)
        # بنعمل Debug APK لأنه مش بيحتاج مفاتيح تشفير (Keystore) ويشتغل على أي موبايل
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: expo-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
